# Prometheus 配置文件
# 重明 (ChongMing) 监控配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ========== API Gateway 指标 ==========
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: /metrics
    
  # ========== Celery Workers 指标 ==========
  - job_name: 'celery-exporter'
    static_configs:
      - targets: ['flower:5555']
    metrics_path: /metrics
    
  # ========== Redis 指标 ==========
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
      
  # ========== PostgreSQL 指标 ==========
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
      
  # ========== Milvus 指标 ==========
  - job_name: 'milvus'
    static_configs:
      - targets: ['milvus:9091']
      
  # ========== Locust 指标 ==========
  - job_name: 'locust'
    static_configs:
      - targets: ['locust-master:8089']
    metrics_path: /stats/requests/csv
    
  # ========== Node Exporter ==========
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
