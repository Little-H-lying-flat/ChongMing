name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install respx

    - name: Verify critical test dependencies
      run: |
        python - <<'PY'
        import aiosqlite
        import respx

        print("aiosqlite:", aiosqlite.__version__)
        print("respx:", respx.__version__)
        PY

    - name: Run Unit Security/Config Tests
      run: |
        pytest tests/unit/test_config_env_validation.py tests/unit/test_execution_screenshot_path_security.py tests/unit/test_smart_ops_routes.py tests/unit/test_test_case_model_contract.py -v

    - name: Run OmniParser Health Regression Tests
      run: |
        pytest tests/unit/test_omniparser_health_probe.py tests/integration/test_omniparser_health_consistency.py -v

    - name: UTF-8 Guard
      run: |
        python ../scripts/check_utf8.py

    - name: Mermaid Diagram Guard
      run: |
        python ../scripts/check_mermaid_diagrams.py

  # Contract gate for Test Case Management module.
  # Mandatory gate: keeps backward compatibility and migration contract stable.
  test-cases-contract:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install respx

    - name: Verify critical test dependencies
      run: |
        python - <<'PY'
        import aiosqlite
        import respx

        print("aiosqlite:", aiosqlite.__version__)
        print("respx:", respx.__version__)
        PY

    - name: Run Test Cases Contract Suite
      run: |
        pytest \
          tests/unit/test_test_case_lifecycle_contract.py \
          tests/integration/test_test_cases_api_contract.py \
          tests/integration/test_test_cases_backward_compat.py -v

  redis-broker-smoke:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Non-eager Redis Broker Smoke
      env:
        APP_ENV: staging
        SECRET_KEY: ci-backend-smoke-secret
        FIRST_SUPERUSER_PASSWORD: ci-backend-smoke-password
        CELERY_BROKER_URL: redis://127.0.0.1:6379/0
        CELERY_TASK_ALWAYS_EAGER: "false"
      run: |
        python - <<'PY'
        from redis import Redis
        from app.core.config import Settings
        from app.worker import celery

        r = Redis.from_url("redis://127.0.0.1:6379/0")
        assert r.ping() is True

        s = Settings()
        assert s.CELERY_TASK_ALWAYS_EAGER is False
        assert s.CELERY_BROKER_URL.startswith("redis://")
        assert celery.conf.task_always_eager is False
        print("redis broker smoke passed")
        PY
